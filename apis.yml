aid: verizon-connect
url: https://raw.githubusercontent.com/api-evangelist/verizon-connect/refs/heads/main/apis.yml
name: Verizon Connect
kind: company
description: Verizon Connect is the fleet management, telematics, and GPS vehicle
  tracking business of Verizon (it grew out of Verizon's acquisitions of Fleetmatics
  and Telogis). Its Reveal platform exposes a documented suite of REST APIs and
  webhooks - the Reveal Integration Services / Fleetmatics Integration Manager (FIM)
  APIs - covering vehicles, drivers, GPS positions and history, trips (segments),
  driver status and safety, hours-of-service logbooks, geofences (places), groups,
  work orders, non-powered asset tracking, fleet inspections, and dash-cam video
  events. The API is not openly self-service - access is gated to Reveal customers
  and their approved integration partners, who request Integration Manager and
  Reveal REST credentials through the Reveal marketplace before they can call the
  documented endpoints.
accessModel:
  pricing: paid
  onboarding: unknown
  trial: false
  try_now: false
