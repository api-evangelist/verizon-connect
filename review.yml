  - url: https://reveal-help.verizonconnect.com/hc/en-us/articles/5491815998099-Create-API-and-webhook-integrations
    type: Documentation
    note: Create API and webhook integrations - Alert and GPS webhook types, API library.
  - url: https://reveal-help.verizonconnect.com/hc/en-us/articles/360010453700-Alert-Types
    type: Documentation
    note: Alert types available in Reveal (used for Alert webhooks).
  - url: https://fim.us.fleetmatics.com/apis
    type: APIReference
    note: Public API list enumerating ~25 Reveal Integration Services APIs.
  - url: https://fim.us.fleetmatics.com/content/home/support/guides/DeveloperQuickStartGuide.htm
    type: Documentation
    note: Developer Quick Start Guide - US/EU base URLs, GET /token flow, 20-minute token validity, Atmosphere auth header, dual-credential requirement.
  - url: https://www.verizonconnect.com/services/api-integration/
    type: Documentation
    note: API toolkit page - contact-sales access, no published pricing, no WebSocket mentioned.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Verizon Connect's Reveal API is
    request/response REST plus polling and outbound webhooks. apis.yml documents
    the real, publicly-listed APIs with endpointsModeled=true (exact schemas are
    behind the gated Integration Manager portal); no OpenAPI or AsyncAPI was
    fabricated.
